name: Deploy

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Protected environment to plan or promote
        required: true
        type: choice
        options: [development, test, staging, production]
      apply:
        description: Apply the reviewed plan and push database migrations
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  plan-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target_environment }}
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ inputs.target_environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      TF_HTTP_ADDRESS: ${{ secrets.TF_HTTP_ADDRESS }}
      TF_HTTP_LOCK_ADDRESS: ${{ secrets.TF_HTTP_LOCK_ADDRESS }}
      TF_HTTP_UNLOCK_ADDRESS: ${{ secrets.TF_HTTP_UNLOCK_ADDRESS }}
      TF_HTTP_USERNAME: ${{ secrets.TF_HTTP_USERNAME }}
      TF_HTTP_PASSWORD: ${{ secrets.TF_HTTP_PASSWORD }}
      TF_HTTP_LOCK_METHOD: POST
      TF_HTTP_UNLOCK_METHOD: DELETE
      TF_HTTP_RETRY_WAIT_MIN: 5
      TF_VAR_provision_cloud: "true"
      TF_VAR_production_approved: ${{ vars.PRODUCTION_APPROVED || 'false' }}
      TF_VAR_supabase_organization_id: ${{ secrets.SUPABASE_ORGANIZATION_ID }}
      TF_VAR_supabase_database_password: ${{ secrets.SUPABASE_DATABASE_PASSWORD }}
      TF_VAR_supabase_region: ${{ vars.SUPABASE_REGION }}
      TF_VAR_supabase_instance_size: ${{ vars.SUPABASE_INSTANCE_SIZE || 'micro' }}
      TF_VAR_vercel_team_id: ${{ secrets.VERCEL_TEAM_ID }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_private_web_url: ${{ vars.PRIVATE_WEB_URL }}
      TF_VAR_public_portal_url: ${{ vars.PUBLIC_PORTAL_URL }}
      TF_VAR_private_domain: ${{ vars.PRIVATE_DOMAIN }}
      TF_VAR_public_domain: ${{ vars.PUBLIC_DOMAIN }}
      TF_VAR_otlp_endpoint: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
      TF_VAR_enable_edge_firewall: ${{ vars.ENABLE_EDGE_FIREWALL || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Refuse production without the protected approval flag
        if: inputs.target_environment == 'production'
        run: test "$TF_VAR_production_approved" = "true"
      - run: terraform init
      - run: terraform validate
      - run: terraform plan -out=promotion.tfplan
      - name: Apply reviewed immutable plan
        if: inputs.apply && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve promotion.tfplan
      - name: Install workspace tools
        if: inputs.apply && github.ref == 'refs/heads/main'
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Promote versioned database migrations
        if: inputs.apply && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DATABASE_PASSWORD }}
        run: |
          PROJECT_REF=$(terraform -chdir=infra/terraform/environments/${{ inputs.target_environment }} output -json platform_ids | jq -r '.supabase')
          pnpm exec supabase link --project-ref "$PROJECT_REF"
          pnpm exec supabase db push --include-all --linked
