name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # CSP connect-src for the loopback storage double of tests/integration/files.test.ts.
          ICE24_STORAGE_ORIGIN: http://127.0.0.1:54329
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:integration
        env:
          ICE24_BROWSER_TESTS: "1"

  # F6-00: UX review artifacts for non-technical reviewers. The gallery runs the private web in
  # demo mode (fictitious data, no API or secrets); both outputs are downloadable from the run.
  ux-review:
    runs-on: ubuntu-latest
    # ~150 captures take ~12 min on a normal runner; slow runners need about twice that.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # Built first: the gallery captures the design-system foundations from it (F6-02).
      - run: pnpm storybook:build
      - run: pnpm ux:snapshots
        env:
          UX_SNAPSHOTS_SKIP_STORYBOOK_BUILD: "1"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ux-review-gallery
          path: docs/qa/phase-6/ux-review/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: storybook-static
          path: storybook-static/
          if-no-files-found: warn
          retention-days: 30
